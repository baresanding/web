<style>
  /* Baresand · sitio: todo a la vista en un tablero; la arena vive detrás de la caja que mirás */
  main{position:relative;z-index:2}
  .hero{min-height:94svh;display:grid;align-content:end;justify-items:center;text-align:center;padding:0 var(--gut) 7vh}
  .hero .h1{font-size:clamp(30px,4vw,56px)}
  .hero .lead{margin-inline:auto;max-width:50ch}
  .hero .ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
  .hero .static-logo{display:none;width:min(560px,80vw);margin:0 auto 6vh}
  .no-webgl .hero .static-logo{display:block}

  .board{max-width:1320px;margin:0 auto;padding:6vh var(--gut) 10vh;scroll-margin-top:80px}
  .board-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px;flex-wrap:wrap}
  .board-head p{margin:0}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(max(210px,24svh),auto);gap:14px}
  .tile{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:14px;padding:22px 24px;border-radius:var(--r);
    background:rgba(37,39,41,.34);border:1px solid var(--line);transition:border-color .5s,background .5s,transform .6s var(--ease),box-shadow .6s;overflow:hidden}
  .tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .6s;
    background:radial-gradient(120% 90% at 50% 120%,rgba(198,155,84,.12),transparent 60%)}
  .tile:hover,.tile:focus-visible,.tile.live{border-color:rgba(198,155,84,.55);background:rgba(37,39,41,.12);transform:translateY(-2px)}
  .tile:hover::after,.tile.live::after{opacity:1}
  .tile:focus-visible{outline:1.5px solid var(--arena);outline-offset:3px}
  .tile.pulse{animation:pulse 1.6s var(--ease)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(198,155,84,0)}30%{box-shadow:0 0 0 6px rgba(198,155,84,.25)}}
  .tile .kicker{margin:0}
  .tile h2{font-weight:300;font-size:clamp(19px,1.55vw,24px);line-height:1.2;margin:0;max-width:22ch;text-wrap:balance;position:relative;text-shadow:0 0 14px #232527,0 0 6px #232527,0 0 2px #232527}
  .tile .kicker,.tile .meta,.tile .foot,.casos-list{position:relative}
  .tile .meta{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
  .tile .meta b{font-weight:400;color:var(--arena);letter-spacing:.12em;font-variant-numeric:tabular-nums}
  .tile .foot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
  .tile .foot span:last-child{width:26px;height:26px;border:1px solid var(--line-hi);border-radius:50%;display:grid;place-items:center;font-size:14px;letter-spacing:0;transition:border-color .3s,color .3s}
  .tile:hover .foot span:last-child,.tile.live .foot span:last-child{border-color:var(--arena);color:var(--arena)}
  .t-enfoque{grid-column:span 2;grid-row:span 2}.t-enfoque h2{font-size:clamp(28px,2.7vw,42px);font-weight:200;max-width:11ch}
  .t-casos{grid-column:span 2}
  .t-contacto{grid-column:span 4;grid-row:span 1;background:rgba(198,155,84,.09);flex-direction:row;align-items:center}
  .t-contacto .c-main{display:flex;flex-direction:column;gap:12px}
  .t-contacto h2{font-size:clamp(24px,2.2vw,34px);font-weight:200;max-width:none}
  .t-contacto .meta{max-width:none}
  .t-contacto .c-side{display:flex;flex-direction:column;align-items:flex-end;gap:12px;text-align:right}
  .t-contacto .c-side .meta{font-size:15px}
  .casos-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px;color:var(--muted)}
  .casos-list li{display:flex;gap:10px;align-items:baseline}
  .casos-list li::before{content:"";width:10px;height:1px;background:var(--arena);flex:none;transform:translateY(-4px)}

  .panel{position:fixed;inset:0;z-index:30;display:grid;grid-template-columns:minmax(0,580px) 1fr;align-items:center;padding:100px var(--gut) 40px;
    background:linear-gradient(90deg,rgba(29,31,32,.95) 0,rgba(29,31,32,.88) 46%,rgba(29,31,32,.12));opacity:0;visibility:hidden;transition:opacity .6s var(--ease),visibility .6s}
  .panel.open{opacity:1;visibility:visible}
  .panel .inner:focus{outline:none}
  main,.site-foot{transition:opacity .6s var(--ease),filter .6s var(--ease)}
  body.panel-open main,body.panel-open .site-foot{opacity:.07;filter:blur(6px)}
  .nav{transition:opacity .5s var(--ease)}
  body.panel-open .nav{opacity:0;pointer-events:none}
  .panel[hidden]{display:none}
  .panel .inner{max-height:calc(100svh - 190px);overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-right:12px;transform:translateY(18px);transition:transform .8s var(--ease);scrollbar-width:thin;scrollbar-color:rgba(247,245,240,.2) transparent}
  .panel.open .inner{transform:none}
  .panel .top{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:var(--gut);right:var(--gut);display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:2}
  .panel .top .where{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--faint)}
  .panel .top .where b{color:var(--arena);font-weight:400}
  .panel .steps-nav{position:absolute;left:var(--gut);bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:2}
  .panel .steps-nav button{font:inherit;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);background:rgba(37,39,41,.6);border:1px solid var(--line-hi);border-radius:40px;padding:9px 14px;cursor:pointer;transition:all .3s}
  .panel .steps-nav button:hover{color:var(--marfil);border-color:var(--arena)}
  .panel .more{grid-template-rows:1fr;opacity:1}
  .panel .faq .more{grid-template-rows:0fr;opacity:0}
  .panel .faq .more.open{grid-template-rows:1fr;opacity:1}
  .panel .faq .more-toggle{display:flex;width:100%;justify-content:space-between;flex-direction:row-reverse;text-align:left;margin:0;padding:16px 0;border-top:1px solid var(--line);
    font-size:15.5px;letter-spacing:0;text-transform:none;color:var(--marfil)}
  .panel .faq .more p{margin:0 0 16px;color:var(--muted);font-size:15px;max-width:52ch}
  .panel .case{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
  .panel .para{color:var(--muted);max-width:52ch;margin:14px 0 0}
  .contact-line{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
  .copy{font:inherit;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--marfil);background:none;border:1px solid var(--line-hi);border-radius:40px;padding:12px 18px;cursor:pointer}
  .copy:hover{border-color:var(--arena);color:var(--arena)}

  .site-foot{position:relative;z-index:2;max-width:1320px;margin:0 auto;padding:22px var(--gut) calc(26px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);
    display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .site-foot a{text-decoration:none;color:var(--muted)} .site-foot a:hover{color:var(--arena)}
  .site-foot nav{display:flex;gap:20px;flex-wrap:wrap}

  @media(max-width:1000px){
    .grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(180px,auto)}
    .t-enfoque{grid-row:span 1}
    .t-contacto{grid-column:span 2}
  }
  @media(max-width:900px){
    .panel{grid-template-columns:1fr;align-items:end;background:linear-gradient(0deg,rgba(29,31,32,.97) 58%,rgba(29,31,32,.3));padding-top:36svh;padding-bottom:84px}
    .panel .inner{max-height:calc(64svh - 110px)}
  }
  @media(max-width:560px){
    .grid{grid-template-columns:1fr}
    .t-enfoque,.t-casos,.t-contacto{grid-column:auto}
    .t-contacto{flex-direction:column;align-items:flex-start}.t-contacto .c-side{align-items:flex-start;text-align:left}
    .hero .ctas .btn{width:100%;justify-content:center}
    .tile h2,.tile .meta,.casos-list{max-width:66%}
    .panel .top .btn{white-space:nowrap;padding:10px 14px}
  }
</style>
</head>
<body>
<canvas id="sand" aria-hidden="true"></canvas>
<div class="vignette"></div>
<main id="main"></main>
<footer class="site-foot" id="pie"></footer>
<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" data-lenis-prevent hidden>
  <div class="top"><span class="where" id="where"></span><button class="btn ghost" id="close" type="button">Cerrar ✕</button></div>
  <div class="inner" id="panelInner" tabindex="-1"></div><div></div>
  <div class="steps-nav"><button type="button" id="prev">← <span></span></button><button type="button" id="next"><span></span> →</button></div>
</div>
<noscript><p style="position:relative;z-index:3;text-align:center;padding:40px">Baresand Electronics · Consultoría de ingeniería electrónica · contacto@baresand.tech</p></noscript>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="logo.js"></script><script src="land.js"></script><script src="content.js"></script><script src="sand.js"></script><script src="site.js"></script>
<script>
(function () {
  'use strict';
  const {C, esc} = Site, S = Site.section, X = C.extra, CT = C.contact;
  const ll = c => `${Math.abs(c.lat).toFixed(2)}° ${c.lat < 0 ? 'S' : 'N'} · ${Math.abs(c.lon).toFixed(2)}° ${c.lon < 0 ? 'O' : 'E'}`;

  /* ---------------------------------------------------------------- the areas */
  const T = [
    {id: 'enfoque', s: S('enfoque'), shape: 'compass', foot: 'Cómo trabajamos'},
    {id: 'donde', s: S('donde'), shape: 'globe', foot: 'Ubicación', meta: `<p class="meta"><b>${ll(CT.coords)}</b></p>`},
    {id: 'electronica', s: S('electronica'), shape: 'chip', foot: 'Servicio'},
    {id: 'firmware', s: S('firmware'), shape: 'code', foot: 'Servicio'},
    {id: 'ia', s: S('ia'), shape: 'neural', foot: 'Servicio'},
    {id: 'casos', s: S('casos'), shape: 'sprout', foot: '3 casos', meta: `<ul class="casos-list">${S('casos').cases.map(k => `<li>${esc(k.title)}</li>`).join('')}</ul>`},
    {id: 'nosotros', s: X.nosotros, shape: 'team', foot: 'Equipo'},
    {id: 'preguntas', s: X.faq, shape: 'question', foot: `${X.faq.items.length} respuestas`},
    {id: 'contacto', s: S('contacto'), shape: 'logo', foot: 'Escribinos'},
  ];
  const tileHTML = t => {
    if (t.id === 'contacto') return `<button class="tile t-contacto" id="contacto" data-id="contacto" data-shape="logo" type="button">
      <span class="c-main"><p class="kicker">${esc(t.s.kicker)}</p><h2>${esc(t.s.title)}</h2><p class="meta">${esc(t.s.lead)}</p></span>
      <span class="c-side"><p class="meta">${esc(CT.email)}<br>${esc(CT.instagram)} · ${esc(CT.place)}</p><span class="btn">Escribinos</span></span></button>`;
    return `<button class="tile t-${t.id}" id="${t.id}" data-id="${t.id}" data-shape="${t.shape}" type="button">
      <p class="kicker">${esc(t.s.kicker)}</p><h2>${esc(t.s.title)}</h2>${t.meta || ''}<span class="foot"><span>${esc(t.foot)}</span><span aria-hidden="true">+</span></span></button>`;
  };
  document.getElementById('main').innerHTML = `
    <section class="hero" id="inicio">
      <div class="static-logo">${window.logoSVG()}</div>
      <p class="kicker">${esc(C.brand.line)}</p><h1 class="h1">${esc(S('inicio').title)}</h1><p class="lead">${esc(S('inicio').lead)}</p>
      <p class="ctas"><a class="btn" href="#contacto">Contanos tu proyecto</a><a class="btn ghost" href="#tablero">Ver en un vistazo</a></p>
    </section>
    <section class="board" id="tablero" aria-label="Baresand en un vistazo">
      <div class="board-head"><p class="kicker">En un vistazo</p><p class="small">Tocá una caja para abrirla</p></div>
      <div class="grid">${T.map(tileHTML).join('')}</div>
    </section>`;
  document.getElementById('pie').innerHTML = `<span>© ${new Date().getFullYear()} Baresand Electronics · ${esc(CT.place)}</span>
    <nav aria-label="Contacto"><a href="mailto:${esc(CT.email)}">${esc(CT.email)}</a><a href="${CT.instagramUrl}" target="_blank" rel="noopener">Instagram ${esc(CT.instagram)}</a></nav>`;

  Site.nav();
  const lenis = Site.smooth();
  const sand = Sand.create(document.getElementById('sand'), {shapes: ['cloud', 'logo', 'compass', 'globe', 'chip', 'code', 'neural', 'sprout', 'car', 'tower', 'team', 'question']});
  if (!sand) document.documentElement.classList.add('no-webgl');
  const heroLayout = () => Site.isMobile() ? {x: 0, y: .42, s: .34} : {x: 0, y: .46, s: .42};
  if (sand) { sand.layout(heroLayout(), true); sand.intro('logo', 3800); }

  /* ---------------------------------------------------------------- the sand follows your attention */
  const tiles = [...document.querySelectorAll('.tile')];
  const canHover = matchMedia('(hover: hover)').matches;
  let focusTile = null, open = null;
  const FIT = {logo: .62, compass: .9, globe: .9, chip: .85, code: .8, neural: .85, sprout: .85, car: .9, tower: .9, team: .85, question: .85};
  function toTile(tile) {
    if (!sand || open || !tile || tile.id === 'contacto') return;
    focusTile = tile;
    tiles.forEach(t => t.classList.toggle('live', t === tile));
    // the figure sits in the free right-hand part of the box, clear of its text
    const r = tile.getBoundingClientRect(), shape = tile.dataset.shape;
    const wide = tile.classList.contains('t-contacto');
    const big = tile.classList.contains('t-enfoque'), side = big || Site.isMobile();   // side by side where there is room, behind the text elsewhere
    const cx = r.left + r.width * (wide ? .5 : big ? .76 : side ? .8 : .72), cy = r.top + r.height * .5;
    const fitH = Math.min(r.height / innerHeight * 2, .9) * .4, fitW = r.width * (side ? .2 : .2) / innerHeight * 2 / 1.05;
    sand.morphTo(shape, 1500);
    sand.layout({x: (cx / innerWidth * 2 - 1) * innerWidth / innerHeight, y: 1 - cy / innerHeight * 2, s: Math.min(fitH, fitW) * FIT[shape]});
    sand.dim(side ? (Site.isMobile() ? .7 : .85) : .28);
  }
  function rest() {
    if (!sand || open) return;
    const b = document.getElementById('tablero').getBoundingClientRect();
    if (b.top < innerHeight * .55) {
      // on touch screens the tile nearest the middle of the screen takes the sand
      let tile = focusTile;
      if (!canHover || !tile) {
        let best = 1e9; for (const t of tiles) { if (t.id === 'contacto') continue; const r = t.getBoundingClientRect(), d = Math.abs(r.top + r.height / 2 - innerHeight * .5); if (d < best) { best = d; tile = t; } }
      }
      toTile(tile);
    } else { tiles.forEach(t => t.classList.remove('live')); focusTile = null; sand.morphTo('logo', 1800); sand.layout(heroLayout()); sand.dim(1); }
  }
  tiles.forEach(t => {
    t.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') toTile(t); });
    t.addEventListener('focus', () => toTile(t));
    t.addEventListener('click', () => go(t.dataset.id));
  });
  let raf = 0; const onScroll = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; rest(); }); };
  addEventListener('scroll', onScroll, {passive: true}); addEventListener('resize', onScroll);

  /* ---------------------------------------------------------------- panels: everything about an area */
  const panel = document.getElementById('panel'), inner = document.getElementById('panelInner');
  const titled = html => html.replace(/<h2 class="h2"/, '<h2 class="h2" id="panelTitle"');
  function contactBody(s) {
    return titled(Site.block(s)) + `
      <form class="form" id="contactForm" novalidate>
        <label>Nombre<input name="n" autocomplete="name" required></label>
        <label>Email<input name="e" type="email" autocomplete="email" required></label>
        <label>Empresa (opcional)<input name="o" autocomplete="organization"></label>
        <label>Tu desafío<textarea name="m" required placeholder="Contanos en pocas líneas qué necesitás resolver"></textarea></label>
        <div><button class="btn" type="submit">Preparar el mail</button></div>
        <p class="note">Se abre tu programa de correo con el mensaje listo para enviar a ${esc(CT.email)}.</p>
        <p class="sent" hidden>Listo: revisá tu programa de correo. Si no se abrió, escribinos directo a ${esc(CT.email)}.</p>
      </form>
      <div class="contact-line"><button class="copy" type="button" id="copyMail">Copiar ${esc(CT.email)}</button>
        <a class="btn ghost" href="${CT.instagramUrl}" target="_blank" rel="noopener">Instagram ${esc(CT.instagram)} ↗</a></div>`;
  }
  function body(t) {
    const s = t.s;
    if (t.id === 'casos') return `<p class="kicker">${esc(s.kicker)}</p><h2 class="h2" id="panelTitle">${esc(s.title)}</h2><p class="lead">${esc(s.lead)}</p>` +
      s.cases.map((k, i) => `<div class="case" data-case="${i}">${Site.caseBlock(k, {open: true})}</div>`).join('');
    if (t.id === 'contacto') return contactBody(s);
    if (t.id === 'nosotros') return titled(Site.block(s)) + s.body.map(p => `<p class="para">${esc(p)}</p>`).join('');
    if (t.id === 'preguntas') return titled(Site.block(s)) + `<div class="faq" style="margin-top:22px">${s.items.map(x => Site.more(x.q, `<p>${esc(x.a)}</p>`)).join('')}</div>`;
    let h = titled(Site.block(s, {noMore: true}));
    if (s.moreLabel) h += `<p class="kicker" style="margin-top:30px">${esc(s.moreLabel)}</p>` + Site.moreBody(s);
    return h;
  }
  function wireContact() {
    const f = document.getElementById('contactForm'); if (!f) return;
    f.addEventListener('submit', e => {
      e.preventDefault();
      if (!f.checkValidity()) { f.reportValidity(); return; }
      const v = k => f.elements[k].value.trim();
      const subject = `Consulta desde la web${v('o') ? ' · ' + v('o') : ''}`;
      const text = `${v('m')}\n\n${v('n')}${v('o') ? ' · ' + v('o') : ''}\n${v('e')}`;
      location.href = `mailto:${CT.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
      f.querySelector('.sent').hidden = false;
    });
    const cp = document.getElementById('copyMail');
    cp.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(CT.email); cp.textContent = 'Copiado'; }
      catch { const r = document.createRange(); r.selectNodeContents(cp); getSelection().removeAllRanges(); getSelection().addRange(r); }
      setTimeout(() => cp.textContent = `Copiar ${CT.email}`, 1800);
    });
  }
  let caseIdx = 0, lastFocus = null;
  function show(id) {
    const i = T.findIndex(q => q.id === id); if (i < 0) return;
    const t = T[i]; open = t;
    inner.innerHTML = body(t); Site.wireMore(inner); wireContact(); inner.scrollTop = 0;
    document.getElementById('where').innerHTML = `<b>${String(i + 1).padStart(2, '0')}</b> / ${String(T.length).padStart(2, '0')} · ${esc(t.s.kicker)}`;
    const prev = T[(i - 1 + T.length) % T.length], next = T[(i + 1) % T.length];
    document.querySelector('#prev span').textContent = prev.s.kicker; document.getElementById('prev').dataset.id = prev.id;
    document.querySelector('#next span').textContent = next.s.kicker; document.getElementById('next').dataset.id = next.id;
    if (panel.hidden) { panel.hidden = false; lastFocus = document.activeElement; requestAnimationFrame(() => panel.classList.add('open')); }
    document.body.classList.add('panel-open');
    lenis && lenis.stop(); document.body.style.overflow = 'hidden';
    setTimeout(() => inner.focus({preventScroll: true}), 60);
    Site.setNav(['electronica', 'firmware', 'ia'].includes(id) ? 'servicios' : id);
    if (sand) {
      const m = Site.isMobile();
      sand.morphTo(t.shape, 1700); sand.layout(m ? {x: 0, y: .66, s: .24} : {x: .5 * innerWidth / innerHeight + .05, y: 0, s: t.shape === 'logo' ? .42 : .5}); sand.dim(1);
      inner.onscroll = null;
      if (t.id === 'casos') {   // walk through the three cases as you read
        inner.onscroll = () => {
          const cs = [...inner.querySelectorAll('.case')], mid = innerHeight * (m ? .75 : .5);
          let k = 0; cs.forEach((c, j) => { if (c.getBoundingClientRect().top < mid) k = j; });
          if (k !== caseIdx) { caseIdx = k; sand.morphTo(t.s.cases[k].shape, 1500); }
        };
        caseIdx = -1; inner.onscroll();
      }
    }
  }
  function hide() {
    if (!open) return;
    const id = open.id; open = null; inner.onscroll = null;
    panel.classList.remove('open'); document.body.classList.remove('panel-open'); setTimeout(() => { if (!open) panel.hidden = true; }, 600);
    lenis && lenis.start(); document.body.style.overflow = '';
    Site.setNav('');
    const tile = document.getElementById(id);
    (lastFocus && lastFocus.focus) ? lastFocus.focus({preventScroll: true}) : tile.focus({preventScroll: true});
    focusTile = tile; rest();
  }
  // every area has its own address (#casos, #contacto...): links, back button and sharing all work
  function go(id) { if (location.hash !== '#' + id) history.pushState({panel: id}, '', '#' + id); show(id); }
  function back() { const st = history.state; if (st && st.panel && !st.entry) history.back(); else { history.replaceState(null, '', location.pathname + location.search); hide(); } }
  addEventListener('popstate', () => { const h = location.hash.slice(1); if (T.some(t => t.id === h)) show(h); else hide(); });
  document.getElementById('close').onclick = back;
  const step = e => { const id = e.currentTarget.dataset.id; history.replaceState({...(history.state || {}), panel: id}, '', '#' + id); show(id); };
  document.getElementById('prev').onclick = step; document.getElementById('next').onclick = step;
  addEventListener('keydown', e => {
    if (!open) return;
    if (e.key === 'Escape') back();
    if (e.key === 'ArrowRight' && !e.target.closest('input,textarea')) document.getElementById('next').click();
    if (e.key === 'ArrowLeft' && !e.target.closest('input,textarea')) document.getElementById('prev').click();
    if (e.key === 'Tab') {   // keep focus inside the panel
      const f = [...panel.querySelectorAll('button,a[href],input,textarea,[tabindex="0"]')].filter(x => x.offsetParent);
      if (!f.length) return; const a = f[0], z = f[f.length - 1];
      if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
    }
  });
  // in-page links: areas open their panel; "Servicios" shows the three service boxes
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]'); if (!a) return;
    const id = a.getAttribute('href').slice(1);
    if (T.some(t => t.id === id)) { e.preventDefault(); e.stopImmediatePropagation(); go(id); return; }
    if (id === 'servicios' || id === 'tablero') {
      e.preventDefault(); e.stopImmediatePropagation(); if (open) back();
      const board = document.getElementById('tablero');
      lenis ? lenis.scrollTo(board, {offset: -20, duration: 1.4}) : board.scrollIntoView({behavior: 'smooth'});
      if (id === 'servicios') setTimeout(() => ['electronica', 'firmware', 'ia'].forEach((k, i) => setTimeout(() => { const t = document.getElementById(k); t.classList.remove('pulse'); void t.offsetWidth; t.classList.add('pulse'); if (i === 0) toTile(t); }, i * 160)), 900);
    }
    if (id === 'inicio') { e.preventDefault(); e.stopImmediatePropagation(); if (open) back(); lenis ? lenis.scrollTo(0, {duration: 1.4}) : scrollTo({top: 0, behavior: 'smooth'}); }
  }, true);

  // arriving with an address opens that area
  const first = location.hash.slice(1);
  if (T.some(t => t.id === first)) { history.replaceState({panel: first, entry: true}, '', '#' + first); setTimeout(() => show(first), 300); }
  else if (first === 'tablero' || first === 'servicios') setTimeout(() => document.getElementById('tablero').scrollIntoView(), 100);
})();
</script>
